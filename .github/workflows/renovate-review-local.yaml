---
name: "Renovate PR Review - Local Model"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: renovate-review-local-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.user.login == 'robot-rosey[bot]'
    name: Breaking Change Analysis
    runs-on: home-ops-runner
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Generate Claude Bot Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: claude-token
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify LiteLLM Reachability
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            http://litellm.ai.svc:4000/v1/models > /tmp/litellm-models.json
          grep -q 'qwen3.5:9b' /tmp/litellm-models.json

      - name: Log LiteLLM session id
        run: |
          {
            echo "### LiteLLM session"
            echo
            echo '```'
            echo "AI_PR-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Review PR with self-hosted model
        id: ai-review
        uses: misospace/pr-reviewer-action@0a2d2732f7358e509e6a85e11160eb25cc5b1b80 # v3.8.0
        with:
          github-token: ${{ steps.claude-token.outputs.token }}
          # ai-stream: false
          ai-max-tokens: 65536
          ai-base-url: "http://litellm.ai.svc:4000/v1"
          ai-model: "qwen3.5:9b"
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          # Stable per-run LiteLLM session id (misospace/pr-reviewer-action#1037).
          ai-extra-headers: |
            x-litellm-session-id: AI_PR-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          # ai-primary-retries: '30'
          # ai-primary-retry-delay-sec: '30'
          # ai-fallback-api-format: 'anthropic'
          # ai-fallback-base-url: "http://litellm.ai.svc:4000"
          # ai-fallback-model: "minimax/MiniMax-M2.7"
          # ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          allowed-source-hosts: 'github.com,api.github.com,artifacthub.io,talos.dev,www.talos.dev'
          context-limit-mode: normal
          tool-mode: native_loop
          tool-max-requests: '4'
          tool-max-response-bytes: '12000'
          tool-allowed-gh-api-repos: '*'
          tool-request-timeout-sec: '20'
          tool-failure-enforcement: 'true'
          tool-min-successful-requests: '1'
          tool-enable-for-forks: 'false'
          # standards-file-candidates: 'AGENTS.md,.agents/*'
          publish-review-comment: 'true'
          comment-marker: <!-- renovate-review-bot -->

      - name: Resolve latest managed review comment URL
        if: steps.ai-review.outputs.should_review == 'true'
        id: review-comment-url
        env:
          GH_TOKEN: ${{ steps.claude-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_MARKER: '<!-- renovate-review-bot -->'
        run: |
          set -euo pipefail

          COMMENT_URL="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --paginate | jq -r --arg marker "$COMMENT_MARKER" '[.[] | select((.body // "") | contains($marker))] | last | .html_url // empty')"

          if [[ -n "$COMMENT_URL" ]]; then
            REVIEW_BODY="Automated review completed. Full findings: $COMMENT_URL"
          else
            REVIEW_BODY="Automated review completed. Full findings are in the managed review comment."
          fi

          {
            echo 'review_body<<EOF'
            echo "$REVIEW_BODY"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Submit PR review decision
        if: steps.ai-review.outputs.should_review == 'true'
        env:
          GH_TOKEN: ${{ steps.claude-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERDICT: ${{ steps.ai-review.outputs.verdict }}
          REVIEW_BODY: ${{ steps.review-comment-url.outputs.review_body }}
        run: |
          set -euo pipefail

          if [[ "$VERDICT" == "approve" ]]; then
            gh pr review "$PR_NUMBER" --repo "$REPO" --approve --body "$REVIEW_BODY"
          elif [[ "$VERDICT" == "request_changes" ]]; then
            gh pr review "$PR_NUMBER" --repo "$REPO" --request-changes --body "$REVIEW_BODY"
          else
            echo "Unexpected verdict from AI reviewer: $VERDICT" >&2
            exit 1
          fi
