---
name: "AI PR Reviewer"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.user.login == 'robot-rosey[bot]'
    name: AI PR Reviewer
    runs-on: arc-home-ops-runner
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Generate Claude Bot Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: claude-token
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify LiteLLM Reachability
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            http://litellm.ai.svc:4000/v1/models > /tmp/litellm-models.json
          grep -q 'minimax/MiniMax-M3' /tmp/litellm-models.json

      - name: Review PR
        id: ai-review
        uses: misospace/pr-reviewer-action@f1605b97871cc821302a8b4827f9058a4d6cd7cb # v2.3.3
        with:
          github_token: ${{ steps.claude-token.outputs.token }}
          ai_api_format: anthropic
          # ai_max_tokens: 65536
          ai_base_url: "http://litellm.ai.svc:4000/v1"
          ai_model: "minimax/MiniMax-M3"
          ai_api_key: ${{ secrets.LITELLM_API_KEY }}
          publish_review_comment: "true"
          publish_mode: review_verdict
          allow_approve: "true"
          system_prompt_file: .github/pr-review-prompt.md
          # standards_file: .github/pr-review-rules.md
          # Pull release notes for any container/chart upgrade the PR touches.
          # Runs even when the PR body has no upstream URLs (the case Renovate
          # bumps fall into most often), so the model always has the upstream
          # diff to summarize instead of just the home-ops YAML diff.
          evidence_providers_file: .github/pr-review-providers.json
          evidence_provider_timeout_sec: "60"
          evidence_provider_max_output_bytes: "80000"
          # Allow direct fetches of URLs Renovate embeds in PR bodies for
          # registries beyond github.com.
          allowed_source_hosts: "github.com,api.github.com,quay.io,docker.io,ghcr.io,gitlab.com,registry.terraform.io,artifacthub.io"
