---
name: "AI PR Reviewer"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.user.login == 'robot-rosey[bot]'
    name: AI PR Reviewer
    runs-on: arc-home-ops-runner
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    steps:
      - name: Generate Claude Bot Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: claude-token
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify LiteLLM Reachability
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          set -euo pipefail
          curl -fsS \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            http://litellm.ai.svc:4000/v1/models > /tmp/litellm-models.json
          grep -q 'minimax/MiniMax-M3' /tmp/litellm-models.json

      - name: Log LiteLLM session id
        run: |
          {
            echo "### LiteLLM session"
            echo
            echo '```'
            echo "AI_PR-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Konflate MCP tools via LiteLLM
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          set -euo pipefail
          # LiteLLM exposes configured MCP tools at /mcp-rest/tools/list. The
          # MCP server is registered with alias `konflate` against the konflate
          # app in flux-system. Confirm the tool surface before letting the
          # reviewer start — without this, the action silently skips a missing
          # server (tool-loop.md: "A server that fails to connect is logged
          # and skipped — it never breaks the loop").
          curl -fsS \
            -H "Authorization: Bearer ${LITELLM_API_KEY}" \
            http://litellm.ai.svc:4000/mcp-rest/tools/list \
            > /tmp/litellm-mcp-tools.json
          python3 -c "
          import json, sys
          tools = json.load(open('/tmp/litellm-mcp-tools.json'))
          konflate = [t for t in tools if str(t.get('name','')).startswith('konflate.')]
          assert konflate, f'no konflate.* tools exposed via LiteLLM: {json.dumps(tools)[:500]}'
          names = sorted(t['name'] for t in konflate)
          print(f'OK: {len(konflate)} konflate MCP tools: {names}')
          "

      - name: Review PR
        id: ai-review
        uses: misospace/pr-reviewer-action@e207a7d11d2ee41f77493b2314e30e7ca694da50 # v3.6.0
        with:
          github-token: ${{ steps.claude-token.outputs.token }}
          ai-api-format: anthropic
          ai-base-url: "http://litellm.ai.svc:4000/v1"
          ai-model: "minimax/MiniMax-M3"
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          # Stable per-run LiteLLM session id (misospace/pr-reviewer-action#1037).
          ai-extra-headers: |
            x-litellm-session-id: AI_PR-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          # Konflate MCP server via LiteLLM. The action's `tool-mcp-token`
          # sends the value verbatim as `Authorization: <token>`; LiteLLM's
          # get_api_key() accepts `Authorization` as a fallback header to
          # `x-litellm-api-key` (litellm/proxy/auth/user_api_key_auth.py),
          # so prepending `Bearer ` here satisfies both the action's bearer
          # semantics and LiteLLM's auth normalization.
          tool-mcp-servers: "konflate=http://litellm.ai.svc:4000/konflate/mcp"
          tool-mcp-token: "Bearer ${{ secrets.LITELLM_API_KEY }}"
          publish-review-comment: "true"
          publish-mode: review_verdict
          allow-approve: "true"
          upstream-link-mode: togithub
          system-prompt-file: .github/pr-review-prompt.md
          # standards-file: .github/pr-review-rules.md
          # Pull release notes for any container/chart upgrade the PR touches.
          # Runs even when the PR body has no upstream URLs (the case Renovate
          # bumps fall into most often), so the model always has the upstream
          # diff to summarize instead of just the home-ops YAML diff.
          evidence-providers-file: .github/pr-review-providers.json
          evidence-provider-timeout-sec: "60"
          evidence-provider-max-output-bytes: "80000"
          # Allow direct fetches of URLs Renovate embeds in PR bodies for
          # registries beyond github.com.
          allowed-source-hosts: "github.com,api.github.com,quay.io,docker.io,ghcr.io,gitlab.com,registry.terraform.io,artifacthub.io"
          # Let v3.2.0+ derive tool-loop evidence budgets from the model's
          # declared 512k window (otherwise v2's ~50KB / ~12KB defaults apply).
          model-context-tokens: '524288'
          # Turn on the native tool loop so the reviewer can call gh_api and
          # the linked-source providers wired up above.
          tool-mode: native_loop
          # Allow gh_api calls to this repo so the model can verify the
          # k8s_manifest required checks (manifest-vs-cluster version,
          # resource quota / limit changes) against the actual HelmRelease
          # diff instead of returning them unresolved.
          tool-allowed-gh-api-repos: '*'
          # Surface tool-loop failures and provider shortfalls as required-
          # check `unresolved` so verdict-policy's strict completeness check
          # has a real signal to grade — matches renovate-review-local.yaml.
          tool-failure-enforcement: 'true'
          tool-min-successful-requests: '1'
          # Same: an evidence-providers-file failure must drop required
          # checks to `unresolved` rather than silently partial.
          evidence-blocker-enforcement: 'true'
          # Reasoning-model output headroom — the v3 inputs page warns
          # under-sized caps on reasoning models produce finish_reason=length
          # and fail verdict JSON parsing. minimax/MiniMax-M3's max_output
          # is 131072, so leave headroom for both the verdict JSON and the
          # review_markdown body without hitting the provider clamp.
          ai-max-tokens: '131072'
