---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Zizmor

# Static security analysis of GitHub Actions workflows.
# https://docs.zizmor.sh/
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/zizmor.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/actions/**
      - .github/zizmor.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    # GitHub-hosted on purpose: no cluster access, no secrets needed.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        # zizmor version comes from the action's bundled, hash-locked
        # `latest` lockfile, so bumping this pin bumps zizmor too.
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          annotations: true
