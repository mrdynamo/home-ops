# Talhelper 3.1.17 emits the secretbox key as "key1", but the cluster's etcd data was
# written by the legacy config, which named it "key2". The name is stored with every
# encrypted secret, so a mismatch makes the apiserver report all secrets as corrupt.
# The secret is the same value as secrets.secretboxencryptionsecret in talsecret.sops.yaml.
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
$$patch: delete
---
apiVersion: v1alpha1
kind: KubeEtcdEncryptionConfig
config:
  resources:
    - providers:
        - secretbox:
            keys:
              - name: key2
                secret: ${ETCD_SECRETBOX_SECRET}
        - identity: {}
      resources:
        - secrets
