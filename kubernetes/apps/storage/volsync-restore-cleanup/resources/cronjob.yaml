---
# Deletes VolSync restore leftovers that Longhorn forces us to keep during a restore
# (cleanupTempPVC: false, backube/volsync#1504): the RD's latestImage VolumeSnapshot and
# volsync-<rd>-dest, once the app PVC populated from them has finished its Longhorn clone.
# Also removes orphaned RDs (app removed; Flux does not prune ssa: IfNotPresent objects).
# See docs/longhorn-disk-pressure-volsync.md §6a/§6b.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: &app volsync-restore-cleanup
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: *app
        spec:
          serviceAccountName: *app
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              # renovate: datasource=docker depName=docker.io/alpine/k8s
              image: docker.io/alpine/k8s:1.36.2@sha256:44ef4942e171939b9c665a4a84beb80e2dcdb9a24330d4651cfdfd2e9deecc47
              command: ["sh", "/scripts/cleanup.sh"]
              env:
                - name: DRY_RUN
                  value: "true" # flip to "false" after reviewing a few runs
                - name: DELETE_ORPHANS
                  value: "true"
                - name: MIN_AGE_SECONDS
                  value: "900"
                - name: TMPDIR
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: *app
            - name: tmp
              emptyDir: {}
