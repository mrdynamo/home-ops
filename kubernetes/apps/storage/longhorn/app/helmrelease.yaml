---
# yaml-language-server: $schema=https://kubernetes-schemas-eov.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app longhorn
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: longhorn
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    persistence:
      defaultClass: false
      defaultDataLocality: best-effort
    defaultSettings:
      allowRecurringJobsWhileVolumeDetached: "true"
      createDefaultDiskLabeledNodes: "true"
      defaultDataLocality: "best-effort"
      defaultDataPath: "/var/lib/longhorn"
      defaultLonghornStaticStorageClass: "longhorn-static"
      defaultReplicaCount: "3"
      # guaranteedInstanceManagerCPU: 20
      nodeDownPodDeletionPolicy: "delete-both-statefulset-and-deployment-pod"
      nodeDrainPolicy: "block-for-eviction-if-contains-last-replica"
      offlineReplicaRebuilding: "enabled"
      orphanAutoDeletion: "true"
      replicaAutoBalance: "least-effort"
      storageMinimalAvailablePercentage: "20" # Stay above kubelet's imagefs.available 15% eviction threshold (Longhorn shares EPHEMERAL)
      # PVCs are thin (~53% full on 2026-11-20); 120% keeps promises physically backed up to ~61% average fill.
      # Pairs with ~100 GiB Storage Reserved per disk (set in the UI). See docs/longhorn-disk-pressure-volsync.md §5 step 6.
      storageOverProvisioningPercentage: "120"
      # Only applies when a node's default disk is first created; ~100 GB of each disk is used by images, caches and logs.
      storageReservedPercentageForDefaultDisk: "30"
    ingress:
      enabled: false
    metrics:
      serviceMonitor:
        enabled: true
        # relabelings:
        #   - sourceLabels: [__meta_kubernetes_pod_container_name, __meta_kubernetes_pod_container_port_number]
        #     regex: 'longhorn-manager;9500'
        #     action: keep
