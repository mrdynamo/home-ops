---
# yaml-language-server: $schema=https://kubernetes-schemas-eov.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: truenas
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: prometheus
      inputName: DS_PROMETHEUS
  # envs:
  #   - name: VAR_REPLICATIONDESTNAME
  #     value: .*-dst
  url: https://grafana.com/api/dashboards/19661/revisions/1/download
  patch:
    scripts:
      # Upstream uses legendFormat __auto on a summed expression, which has no
      # metric name, so Grafana falls back to printing the full label set.
      - '(.panels[] | select(.title == "CPU Usage") | .targets[].legendFormat) = "CPU Usage"'
