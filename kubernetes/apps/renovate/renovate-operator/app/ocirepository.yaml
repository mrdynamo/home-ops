---
# yaml-language-server: $schema=https://kubernetes-schemas-eov.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 7.0.0
    digest: sha256:cb8f083de9eb9e64af50ffadf8a7c62a3f8f41014d465da7f38effe15fdc8ad3
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/mogenius/renovate-operator/\.github/workflows/release\.yaml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$'
