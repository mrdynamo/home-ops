apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: renovate-operator
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.9.0
    digest: sha256:cb810b9bd0d7617ffbd6cf769602a625d9a611582016971af1181c43e35551d0
  url: oci://ghcr.io/mogenius/helm-charts/renovate-operator
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/mogenius/renovate-operator/\.github/workflows/release\.yaml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$'
