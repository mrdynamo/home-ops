---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app node-forensics
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        type: daemonset
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          # Host network so /sys/class/net and the pings see the node's own NIC.
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          priorityClassName: system-node-critical
          terminationGracePeriodSeconds: 5
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-04
          tolerations:
            - operator: Exists
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            command:
              - /bin/sh
              - /scripts/node-forensics.sh
            env:
              TZ: UTC
              FORENSICS_DIR: /forensics
              HEARTBEAT_INTERVAL: "10"
              RETENTION_DAYS: "30"
              # The default gateway is always pinged; these are extra: API VIP, internet.
              PING_TARGETS: 192.168.30.10 1.1.1.1
            securityContext:
              # Reads /dev/kmsg (CAP_SYSLOG) and sends ICMP (CAP_NET_RAW).
              privileged: true
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 32Mi
    persistence:
      scripts:
        type: configMap
        name: *app
        defaultMode: 0755
        globalMounts:
          - path: /scripts
            readOnly: true
      forensics:
        # On the node's EPHEMERAL partition (/var), which survives a power cycle.
        type: hostPath
        hostPath: /var/lib/node-forensics
        hostPathType: DirectoryOrCreate
        globalMounts:
          - path: /forensics
