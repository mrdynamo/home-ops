    operation: copy
  ref:
    tag: 0.38.1
    digest: sha256:1f4f7e03528d1751892d03058df1403879d90d3f79988d3e67aedcedce77f981
  url: oci://ghcr.io/home-operations/charts-mirror/trivy-operator
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/home-operations/charts-mirror/\.github/workflows/app-builder\.yaml@refs/heads/main$'
