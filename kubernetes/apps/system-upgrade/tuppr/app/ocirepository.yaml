    matchOIDCIdentity:
      - issuer: '^https://token\.actions\.githubusercontent\.com$'
        subject: '^https://github\.com/home-operations/tuppr/\.github/workflows/release\.yaml@refs/tags/[0-9]+\.[0-9]+\.[0-9]+$'
