---
# yaml-language-server: $schema=https://kubernetes-schemas-eov.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: &name postgres
  annotations:
    # required for seamless bootstrap: https://github.com/cloudnative-pg/cloudnative-pg/issues/5778#issuecomment-2783417464
    cnpg.io/skipEmptyWalArchiveCheck: enabled
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-trixie@sha256:1abcfd1cac6d53cda5185706819aab36d66a4ed88e99fc2ae44ab0826aa99f00

  priorityClassName: home-prod

  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - k8s-04

  certificates:
    serverCASecret: postgres-server-cert
    serverTLSSecret: postgres-server-cert
    clientCASecret: postgres-client-ca
    replicationTLSSecret: postgres-client-cert

  storage:
    size: 12Gi
    storageClass: longhorn-fast

  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised

  plugins:
    - name: &plugin barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: &store cloudflare-r2-store

  externalClusters:
    - name: &src source
      plugin:
        name: *plugin
        parameters:
          barmanObjectName: *store
          serverName: *name

  ##### RECOVERY #####

  ## Uncomment the below section to enable recovery from r2.
  ## Complete this prior to bootstrapping the cluster.

  bootstrap:
    recovery:
      source: *src

  monitoring:
    enablePodMonitor: true

  postgresql:
    pg_hba:
      - hostssl   all all all cert clientcert=verify-full map=pooler-map
    pg_ident:
      - pooler-map pooler-rw all

    shared_preload_libraries:
      - "timescaledb"

    parameters:
      timescaledb.telemetry_level: "off" # For TimescaleDB (Tracearr)
      timescaledb.max_tuples_decompressed_per_dml_transaction: "0" # For TimescaleDB (Tracearr)
      max_locks_per_transaction: "4096" # For TimescaleDB (Tracearr) DEFAULT: 128
      max_connections: "150" # Increase maximum connections DEFAULT: 100
      # Cap the WAL the HA replication slot can hold for a down replica, so it
      # can't fill the primary's PVC (archive_timeout alone adds ~4.6 GB/day).
      # Past the cap the slot is invalidated and the replica catches up from
      # R2; drop the slot on the primary and CNPG recreates it. DEFAULT: -1
      max_slot_wal_keep_size: "2GB"

    extensions:

      - name: timescaledb
        image:
          reference: ghcr.io/mrdynamo/timescaledb-bridge:2.32.1@sha256:a7c86423a3b19ac133870954a1d3f64aaf6fda049334fe1a8644f662ffc7577b

      - name: timescaledb_toolkit
        image:
          reference: ghcr.io/mrdynamo/timescaledb-toolkit:1.28.0@sha256:b50dee09a1b37a55260459d5c7c9205574a8cb97e9d739b7d47e0c3f71989ccf

  managed:
    roles:

      - name: pooler-rw
        ensure: present
        login: true
        superuser: false
        disablePassword: true

      - name: authentik
        ensure: present
        login: true
        superuser: false
        disablePassword: true

      - name: dispatcharr
        ensure: present
        login: true
        superuser: false
        disablePassword: true

      - name: gatus
        ensure: present
        login: true
        superuser: false
        disablePassword: true

      - name: litellm
        ensure: present
        login: true
        superuser: false
        disablePassword: true
        inRoles:
          - pg_monitor # prune-prompts job reads pg_wal size to pace itself

      - name: paperless
        ensure: present
        login: true
        superuser: false
        disablePassword: true

      - name: pgadmin
        ensure: present
        login: true
        superuser: true
        disablePassword: true

      - name: tracearr
        ensure: present
        login: true
        superuser: false
        disablePassword: true
