---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app truenas-cert
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        type: cronjob
        cronjob:
          ##
          ##     No-op unless the active TrueNAS UI cert differs from the
          ##     cert in 1Password, so a daily run is cheap and picks up
          ##     a renewal within 24h.
          ##
          schedule: 0 9 * * *
          timeZone: &TZ America/Chicago
          backoffLimit: 1
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.12-bookworm-slim@sha256:e5b65587bce7de595f299855d7385fe7fca39b8a74baa261ba1b7147afa78e58
            command: ["python3", "-I", "/scripts/update-cert.py"]
            env:
              TZ: *TZ
              TRUENAS_HOST: nas-01.ad.${SECRET_DOMAIN}
              CERT_NAME_PREFIX: ad-${SECRET_DOMAIN/./-}
              CERT_DIR: /secrets
              API_KEY_FILE: /secrets/api-key
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 64Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      scripts:
        type: configMap
        name: *app
        globalMounts:
          - path: /scripts
            readOnly: true
      secrets:
        type: secret
        name: truenas-cert-secret
        globalMounts:
          - path: /secrets
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
