---
# yaml-language-server: $schema=https://kubernetes-schemas-eov.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-cert
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: truenas-cert-secret
    template:
      data:
        api-key: "{{ .TRUENAS_CERT_UPDATE_API_KEY }}"
        # The cert-manager PushSecret stores both values base64-encoded.
        tls.crt: '{{ index . "tls.crt" | b64dec }}'
        tls.key: '{{ index . "tls.key" | b64dec }}'
  dataFrom:
    - extract:
        key: truenas
    - extract:
        key: ad-${SECRET_DOMAIN/./-}-production-tls
