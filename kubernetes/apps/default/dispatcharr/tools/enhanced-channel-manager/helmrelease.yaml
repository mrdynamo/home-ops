---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app enhanced-channel-manager
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/motwakorb/enhancedchannelmanager
              tag: 0.18.2-0045-dev@sha256:70cbef6fbb7a5a10b32102708037ad2d0c88c28763fb8c641ab3bb93fccf4c1d
            env:
              TZ: America/Chicago
              ECM_LIMIT_CONCURRENCY: 25
              ECM_TIMEOUT_KEEP_ALIVE: 15
              MCP_HOST: localhost
              MCP_SECRETS_DIR: /run/secrets/ecm-mcp
            probes:
              liveness: &probes
                enabled: false
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: &port 6100
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 72m
                memory: 1004Mi
              limits:
                memory: 1004Mi
          mcp:
            image:
              repository: ghcr.io/motwakorb/enhancedchannelmanager-mcp
              tag: 0.18.2-0045-dev@sha256:05b8f36914a2e6770cc318e25559c38d3fa34f84a43c9e1c58e770513e70ce48
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 100Mi
            env:
              TZ: America/Chicago
              ECM_URL: http://localhost:6100
              MCP_PORT: &mcp_port 6101
              MCP_SECRETS_DIR: /run/secrets/ecm-mcp
              MCP_BIND_ADDRESS: 0.0.0.0
              MCP_ALLOWED_HOSTS: enhanced-channel-manager.default.svc,enhanced-channel-manager.default.svc.cluster.local
              MCP_TRUSTED_PROXY_IPS: 10.42.0.0/16
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
          mcp:
            port: *mcp_port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${INTERNAL_SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          *app :
            app:
              - path: /config
              - path: /run/secrets/ecm-mcp
                subPath: mcp
            mcp:
              - path: /run/secrets/ecm-mcp
                subPath: mcp
      backups:
        type: nfs
        server: 192.168.20.21
        path: /mnt/tank/media/plex
        globalMounts:
          - path: /config/backups
            subPath: dispatcharr/enhanced-channel-manager
      scripts:
        type: configMap
        name: *app
        defaultMode: 0755
        advancedMounts:
          *app :
            app:
              - path: /app/entrypoint.sh
                subPath: entrypoint.sh
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
