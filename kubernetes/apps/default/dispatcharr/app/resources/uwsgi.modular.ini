; Dispatcharr modular deployment uwsgi override.
;
; Mounted at /app/docker/uwsgi.modular.ini by the helmrelease (see
; persistence.scripts.advancedMounts). The shipped image file at that path
; sets http-timeout = 600 and socket-timeout = 600, which causes the live
; MPEG-TS byte stream to be closed every ~10 minutes (591s observed in
; uwsgi.requests logs: "Broken pipe [core/writer.c line 429] during
; GET /live/.../NNN.ts"). The disconnect happens on the nginx -> uwsgi
; hop, not on the cluster network, and is visible to clients as a ~20 min
; cap (1188s = 2x http-timeout) when their player reconnects once before
; giving up.
;
; Everything else in the shipped uwsgi.modular.ini is preserved verbatim
; so the redis-server / celery / daphne attach-daemon lines, the
; $(UWSGI_WORKERS) substitution, and the gevent monkey-patch all keep
; working. Only the two per-request timers are changed:
;
;   http-timeout     600   -> 43200  (12h, well past any single viewing session)
;   socket-timeout   600   -> 43200  (match; bounds individual send/recv calls)
;
; harakiri is intentionally left off: a per-request CPU-time kill is the
; wrong tool for a long-lived byte-stream response, and a misbehaving
; worker that hangs forever is a separate failure mode (pod-level RSS
; growth) which the existing helmrelease comment about
; UWSGI_RELOAD_ON_RSS already anticipates.

[uwsgi]

; Modular deployment mode - external PostgreSQL, Redis, and Celery
attach-daemon = daphne -b 0.0.0.0 -p 8001 dispatcharr.asgi:application

# Core settings
chdir = /app
module = dispatcharr.wsgi:application
virtualenv = /dispatcharrpy
master = true
env = DJANGO_SETTINGS_MODULE=dispatcharr.settings
env = USE_NGINX_ACCEL=true
socket = /app/uwsgi.sock
chmod-socket = 777
vacuum = true
die-on-term = true
static-map = /static=/app/static

# Worker management
workers = $(UWSGI_WORKERS)

# Optimize for streaming
; OVERRIDE: was http-timeout = 600 / socket-timeout = 600 in the shipped
; image. See the comment at the top of this file for why.
http = 0.0.0.0:5656
http-keepalive = 1
buffer-size = 65536
post-buffering = 4096
http-timeout = 43200
socket-timeout = 43200
lazy-apps = true

# Async mode
gevent = 400
gevent-early-monkey-patch = true
import = dispatcharr.gevent_patch

# Performance tuning
thunder-lock = true
log-4xx = true
log-5xx = true
disable-logging = false

# Logging
log-master = true
logformat-strftime = true
log-date = %%Y-%%m-%%d %%H:%%M:%%S,000
log-format = %(ftime) $(DISPATCHARR_LOG_LEVEL) uwsgi.requests Worker ID: %(wid) %(method) %(status) %(uri) %(msecs)ms
log-buffering = 1024
