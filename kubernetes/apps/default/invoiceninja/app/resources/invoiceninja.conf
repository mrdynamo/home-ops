# https://nginx.org/en/docs/http/ngx_http_core_module.html
client_max_body_size 10M;
client_body_buffer_size 10M;
server_tokens off;

# https://nginx.org/en/docs/http/ngx_http_fastcgi_module.html
fastcgi_buffers 32 16K;

# https://nginx.org/en/docs/http/ngx_http_gzip_module.html
gzip on;
gzip_comp_level 2;
gzip_min_length 1M;
gzip_proxied any;
gzip_types *;

# The Flutter web app (5.13.54+) loads main.dart.mjs as a module, which a browser refuses unless it has a
# JavaScript type (laravel.conf also sends nosniff). nginx's stock mime.types has none for .mjs; this adds
# it to that map. Mirrors invoiceninja/dockerfiles#908.
types { text/javascript mjs; }
