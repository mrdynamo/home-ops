---
# yaml-language-server: $schema=https://kubernetes-schemas-eov.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app invoiceninja
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: invoiceninja-secret
    template:
      data:
        APP_KEY: "{{ .INVOICENINJA_APP_KEY }}"
        IN_USER_EMAIL: "{{ .INVOICENINJA_IN_USER_EMAIL }}"
        IN_PASSWORD: "{{ .INVOICENINJA_IN_PASSWORD }}"
        DB_PASSWORD: "{{ .INVOICENINJA_DB_PASSWORD }}"
        MARIADB_ROOT_PASSWORD: "{{ .INVOICENINJA_MARIADB_ROOT_PASSWORD }}"
  dataFrom:
    - extract:
        key: *app
