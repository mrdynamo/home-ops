---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: maintainerr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: maintainerr
  values:
    controllers:
      maintainerr:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-ui:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.29.0@sha256:7487d374290e59add65407ec295629e489f9057dbf18e2a9dff70d6201ffb6f9
            command:
              - sh
              - -c
              - |
                find /opt/app/apps/server/dist/ui -type f -not -path '*/node_modules/*' -print0 | xargs -0 sed -i "s,/__PATH_PREFIX__,,g"
                cp -rv /opt/app/apps/server/dist/ui/* /ui
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: false
              capabilities: {drop: ["ALL"]}
        containers:
          app:
            image:
              repository: ghcr.io/maintainerr/maintainerr
              tag: 3.29.0@sha256:7487d374290e59add65407ec295629e489f9057dbf18e2a9dff70d6201ffb6f9
            command:
              - /bin/sh
              - -c
              - |
                cd /opt/app/apps/server || exit 1
                export npm_package_version="$(node -p "require('./package.json').version" 2>/dev/null)"
                exec node dist/main
            env:
              TZ: America/Chicago
              UI_PORT: &port 80
              #API_PORT: 3002
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec: &probeSpec
                  httpGet: &probeHttpGet
                    path: /api/health/live
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                <<: *probes
                spec:
                  <<: *probeSpec
                  httpGet:
                    <<: *probeHttpGet
                    path: /api/health/ready
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 23m
                memory: 826Mi
              limits:
                memory: 826Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${INTERNAL_SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      ui:
        type: emptyDir
        advancedMounts:
          maintainerr:
            init-ui:
              - path: /ui
            app:
              - path: /opt/app/apps/server/dist/ui
      tmp:
        type: emptyDir
