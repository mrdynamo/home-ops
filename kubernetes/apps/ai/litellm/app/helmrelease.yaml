---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm
spec:
  timeout: 10m
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 2
        strategy: RollingUpdate
        initContainers:
          gen-prisma-cert:
            image:
              repository: docker.io/library/alpine
              tag: 3.24.3
            command:
              - /bin/sh
              - -ec
              - |
                apk add --no-cache openssl
                openssl pkcs12 -export \
                  -in /var/run/secrets/postgresql/tls.crt \
                  -inkey /var/run/secrets/postgresql/tls.key \
                  -out /var/run/secrets/prisma/client-identity.p12 \
                  -passout pass:
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.106.2@sha256:7294b90f868c5c38c99b83021c7ba46f9b439e95f8e32964c925c7d2563a03f7
            args:
              - --config=/app/config.yaml
            env:
              ## General App Settings
              # LITELLM_LOG: DEBUG
              LITELLM_MODE: PRODUCTION
              DOCS_URL: "/docs"
              ROOT_REDIRECT_URL: "/ui"
              UI_USERNAME: admin
              MAX_STRING_LENGTH_PROMPT_IN_DB: 1024 # Maximum string length for prompts stored in the database. DEFAULT: 2048 characters
              ## SSO Settings
              GENERIC_AUTHORIZATION_ENDPOINT: "https://auth.${SECRET_DOMAIN}/application/o/authorize/"
              GENERIC_TOKEN_ENDPOINT: "https://auth.${SECRET_DOMAIN}/application/o/token/"
              GENERIC_USERINFO_ENDPOINT: "https://auth.${SECRET_DOMAIN}/application/o/userinfo/"
              GENERIC_SCOPE: "openid profile email litellm-role"
              GENERIC_USER_ROLE_ATTRIBUTE: "role"
              PROXY_BASE_URL: "https://{{ .Release.Name }}.${INTERNAL_SECRET_DOMAIN}"
              AUTO_REDIRECT_UI_LOGIN_TO_SSO: true
              ## Postgres Settings
              DATABASE_URL: "postgresql://litellm@pooler-rw.database.svc:5432/litellm?sslmode=require&sslidentity=/var/run/secrets/prisma/client-identity.p12&sslcert=/var/run/secrets/root-ca/ca.crt"
              REDIS_HOST: "{{ .Release.Name }}-dragonfly.ai.svc"
              REDIS_PORT: "6379"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
            resources:
              requests:
                cpu: 31m
                memory: 1277Mi
              limits:
                memory: 1277Mi
      prune-prompts:
        type: cronjob
        cronjob:
          schedule: "30 4 * * *"
          timeZone: America/Chicago
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
          backoffLimit: 1
        pod:
          restartPolicy: Never
        containers:
          app:
            image:
              repository: ghcr.io/cloudnative-pg/postgresql
              tag: 18.6-minimal-trixie@sha256:64abc98a4387361afd6821a3a99f975763bbd87bbdde9449e75ad6002528a318
            command:
              - /bin/sh
              - /app/prune-prompts.sh
            env:
              PROMPT_RETENTION_DAYS: "60"
              DRY_RUN: true
              PGAPPNAME: litellm-prune-prompts
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: url
            # Root (with no capabilities) so libpq can read the root-owned
            # cert-manager CSI client key, same as the dispatcharr backup job.
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 64Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        enabled: true
        endpoints:
          - port: http
            path: /metrics
            interval: 5s
    route:
      app:
        hostnames:
          - "{{ .Release.Name }}.${INTERNAL_SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
    persistence:
      config:
        type: configMap
        name: *app
        advancedMounts:
          *app :
            app:
              - path: /app/config.yaml
                subPath: config.yaml
                readOnly: true
          prune-prompts:
            app:
              - path: /app/prune-prompts.sh
                subPath: prune-prompts.sh
                readOnly: true
      cache:
        type: emptyDir
        advancedMounts:
          *app :
            app:
              - path: /app/cache
      prisma-certs:
        type: emptyDir
        advancedMounts:
          *app :
            gen-prisma-cert:
              - path: /var/run/secrets/prisma
            app:
              - path: /var/run/secrets/prisma
