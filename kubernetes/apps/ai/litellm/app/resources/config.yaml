  #########################
  # Minimax API Models    #
  #########################
  - model_name: minimax-m2.7
    litellm_params:
      <<: *minimax_litellm_params
      model: minimax/MiniMax-M2.7
    model_info: &minimax-m27_model_info
      <<: *minimax_model_info
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_creation_input_token_cost: 0.000000375
      cache_read_input_token_cost: 0.00000006
      max_input_tokens: 204800
      max_output_tokens: 131072
      max_tokens: 131072
      supports_tool_choice: true
      supports_reasoning: true
      supports_vision: false
      supports_prompt_caching: true
      supports_computer_use: false

  - model_name: minimax-m2.7-openai
    litellm_params:
      <<: *minimax_openai_litellm_params
      model: minimax/MiniMax-M2.7
    model_info: *minimax-m27_model_info

  - model_name: minimax-m3
    litellm_params:
      <<: *minimax_litellm_params
      model: minimax/MiniMax-M3
    model_info: &minimax-m3_model_info
      <<: *minimax_model_info
      # MiniMax caching is automatic and has no cache-write price: new input
      # tokens bill at the input rate, so cache writes are priced as input.
      # Prompts over 512k input tokens bill every category at 2x — LiteLLM
      # parses the threshold out of the `_above_512k_tokens` field names.
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_creation_input_token_cost: 0.0000003
      cache_read_input_token_cost: 0.00000006
      input_cost_per_token_above_512k_tokens: 0.0000006
      output_cost_per_token_above_512k_tokens: 0.0000024
      cache_creation_input_token_cost_above_512k_tokens: 0.0000006
      cache_read_input_token_cost_above_512k_tokens: 0.00000012
      max_input_tokens: 1000000
      max_output_tokens: 131072
      max_tokens: 131072
      supports_tool_choice: true
      supports_reasoning: true
      supports_vision: true
      supports_prompt_caching: true
      supports_computer_use: true

  - model_name: minimax-m3-openai
    litellm_params:
      <<: *minimax_openai_litellm_params
      model: minimax/MiniMax-M3
    model_info: *minimax-m3_model_info

  - model_name: minimax-m3.1-flash
    litellm_params:
      <<: *minimax_litellm_params
      model: minimax/MiniMax-M3.1-Flash
    model_info: &minimax-m31-flash_model_info
      <<: *minimax_model_info
      # Single rate at every prompt length; no cache-write price (see M3).
      # Thinking is always on — `thinking: disabled` returns a 400.
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      cache_creation_input_token_cost: 0.00000015
      cache_read_input_token_cost: 0.000000015
      max_input_tokens: 1000000
      max_output_tokens: 131072
      max_tokens: 131072
      supports_tool_choice: true
      supports_reasoning: true
      supports_vision: true
      supports_prompt_caching: true
      supports_computer_use: true

  - model_name: minimax-m3.1-flash-openai
    litellm_params:
