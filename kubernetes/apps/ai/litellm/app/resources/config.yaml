  #########################
  # Anthropic Plan Models #
  #########################
  # Cost/tokens below reflect standard PAYG rates so cost-tracking dashboards
  # display meaningful values; actual billing is via each user's Claude
  # Pro/Max/Team subscription token, forwarded per-request from the client
  # through `Authorization: Bearer sk-ant-oat...`. See
  # https://docs.litellm.ai/docs/tutorials/claude_code_max_subscription.

  - model_name: anthropic/claude-opus-5-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-opus-5-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_creation_input_token_cost: 0.000005
      cache_read_input_token_cost: 0.0000002

  - model_name: anthropic/claude-opus-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-opus-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_creation_input_token_cost: 0.00000625
      cache_read_input_token_cost: 0.0000005

  - model_name: anthropic/claude-opus-4-8
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-opus-4-8
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_creation_input_token_cost: 0.00000625
      cache_read_input_token_cost: 0.0000005

  - model_name: anthropic/claude-sonnet-5-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-sonnet-5-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 0.0000001

  - model_name: anthropic/claude-sonnet-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-sonnet-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 0.0000003

  - model_name: anthropic/claude-sonnet-4-6
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-sonnet-4-6
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 0.0000003

  - model_name: anthropic/claude-haiku-5-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-haiku-5-5
    model_info:
      <<: *anthropic_model_info
      # Haiku 5.5 is the only model on Anthropic priced by prompt LENGTH:
      # a request whose prompt exceeds 100,000 tokens bills at the
      # `_above_100k_tokens` rate on every category. LiteLLM parses the
      # threshold out of the field name, so one entry covers both tiers —
      # no separate >100k deployment needed. Prompt length counts cache
      # reads and writes too, matching Anthropic's own billing rule.
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_creation_input_token_cost: 0.000000125
      cache_read_input_token_cost: 0.00000001
      input_cost_per_token_above_100k_tokens: 0.0000005
      output_cost_per_token_above_100k_tokens: 0.0000025
      cache_creation_input_token_cost_above_100k_tokens: 0.000000625
      cache_read_input_token_cost_above_100k_tokens: 0.00000005

  - model_name: anthropic/claude-haiku-4-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-haiku-4-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      cache_creation_input_token_cost: 0.00000125
      cache_read_input_token_cost: 0.0000001
      max_input_tokens: 200000
      max_output_tokens: 65536
      max_tokens: 65536
      # Haiku-4.5 lacks extended thinking and computer-use — flip both off.
      supports_reasoning: false
      supports_computer_use: false

#########################
#      MCP Servers      #
#########################
mcp_servers:

  github_mcp_server:
    alias: github
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/GITHUB_MCP_PAT
    url: https://api.githubcopilot.com/mcp/
    description: "GitHub MCP Server"

  enhanced_channel_manager_mcp_server:
    alias: ecm
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/ECM_MCP_API_KEY
    url: http://enhanced-channel-manager.default.svc:6101/mcp
    description: "Enhanced Channel Manager MCP Server"

  konflate_mcp_server:
    alias: konflate
    transport: http
    auth_type: none
    url: http://konflate.flux-system.svc:8080/mcp
    description: "Konflate MCP Server"

#########################
# Application Settings  #
#########################
general_settings:
  health_check_endpoint: /v1/health
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: customer
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: internal_user
  store_model_in_db: true
  supported_db_objects: [guardails, vector_stores, pass_through_endpoints, prompts]
  store_prompts_in_spend_logs: true
  use_redis_transaction_buffer: true # HA
  enable_mcp_registry: true
  require_key_mcp_access_defined: true

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # Required for per-user OAuth tokens: one expired `sk-ant-oat01` would
  # otherwise cooldown the deployment and surface 429s for everyone else.
  disable_cooldowns: true
  # Claude Code's auto-mode permission classifier requests a bare
  # `claude-sonnet-5` (server-side flag, ignores ANTHROPIC_DEFAULT_*_MODEL and
  # CLAUDE_CODE_AUTO_MODE_MODEL). Unmatched, every classifier call fails and
  # auto mode blocks the tool call. Route it to Sonnet 5.5.
  model_group_alias:
    claude-sonnet-5: anthropic/claude-sonnet-5-5
    claude-sonnet-5[1m]: anthropic/claude-sonnet-5-5

litellm_settings:
  success_callback: ["prometheus"]
  prometheus_adapter: true
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  drop_params: false
  set_verbose: false

environment_variables: []
  # - DATABASE_URL
  # - MINIMAX_API_KEY
  # - MOONSHOT_API_KEY
  # - REDIS_HOST
  # - REDIS_PORT
