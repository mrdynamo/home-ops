_context_values:
  2k: &2k 2048
  4k: &4k 4096
  8k: &8k 8192
  16k: &16k 16384
  32k: &32k 32768
  64k: &64k 65536
  128k: &128k 131072
  256k: &256k 262144
  512k: &512k 524288

_ollama_litellm_params: &ollama_litellm_params
  api_base: os.environ/OLLAMA_BASE_URL
  api_key: ollama
  num_ctx: *32k

_ollama_model_info: &ollama_model_info
  litellm_provider: ollama
  input_cost_per_token: 0
  output_cost_per_token: 0
  max_tokens: *16k
  max_output_tokens: *16k

_minimax_litellm_params: &minimax_litellm_params
  api_base: https://api.minimax.io/anthropic
  api_key: &minimax_api_key os.environ/MINIMAX_PLAN_API_KEY

_minimax_openai_litellm_params: &minimax_openai_litellm_params
  api_base: https://api.minimax.io/v1
  api_key: *minimax_api_key

_minimax_model_info: &minimax_model_info
  litellm_provider: minimax
  mode: chat

_anthropic_litellm_params: &anthropic_litellm_params
  api_base: https://api.anthropic.com
  # No `api_key` here on purpose: the docs say a deployment without one "serves
  # only subscription users" — with one, a request without a subscription
  # token silently falls back to that PAYG key and bypasses the OAuth path.
  # Per-user `Authorization: Bearer sk-ant-oat...` is forwarded as-is.
  # https://docs.litellm.ai/docs/tutorials/claude_code_max_subscription
  # api_key: &anthropic_api_key os.environ/ANTHROPIC_API_KEY

_anthropic_model_info: &anthropic_model_info
  litellm_provider: anthropic
  mode: chat
  # Uniform across the entire Anthropic line on Claude Pro/Max today.
  # The only carve-outs are Haiku-4.5, which flips the reasoning and
  # computer_use flags off and drops to a 200k/64k window — see its
  # per-model block. Per-model pricing is always spelled out; only these
  # provider-wide traits belong in the anchor.
  supports_tool_choice: true
  supports_vision: true
  supports_prompt_caching: true
  supports_reasoning: true
  supports_computer_use: true
  max_input_tokens: 1000000
  max_output_tokens: 131072
  max_tokens: 131072

