  #########################
  # Anthropic Plan Models #
  #########################
  # Cost/tokens below reflect standard PAYG rates so cost-tracking dashboards
  # display meaningful values; actual billing is via each user's Claude
  # Pro/Max/Team subscription token, forwarded per-request from the client
  # through `Authorization: Bearer sk-ant-oat...`. See
  # https://docs.litellm.ai/docs/tutorials/claude_code_max_subscription.

  - model_name: claude-fable-5-2
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-fable-5-2
    model_info:
      <<: *anthropic_model_info
      # Cache reads are 0.025x base input on Fable 5.2 (not the usual 0.1x).
      input_cost_per_token: 0.000008
      output_cost_per_token: 0.00004
      cache_creation_input_token_cost: 0.00001
      cache_read_input_token_cost: 0.0000002

  - model_name: claude-opus-5-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-opus-5-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000004
      output_cost_per_token: 0.00002
      cache_creation_input_token_cost: 0.000005
      cache_read_input_token_cost: 0.0000002

  - model_name: claude-sonnet-5-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-sonnet-5-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 0.0000001

  - model_name: claude-haiku-5-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-haiku-5-5
    model_info:
      <<: *anthropic_model_info
      # Haiku 5.5 is the only model on Anthropic priced by prompt LENGTH:
      # a request whose prompt exceeds 100,000 tokens bills at the
      # `_above_100k_tokens` rate on every category. LiteLLM parses the
      # threshold out of the field name, so one entry covers both tiers —
      # no separate >100k deployment needed. Prompt length counts cache
      # reads and writes too, matching Anthropic's own billing rule.
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      cache_creation_input_token_cost: 0.000000125
      cache_read_input_token_cost: 0.00000001
      input_cost_per_token_above_100k_tokens: 0.0000005
      output_cost_per_token_above_100k_tokens: 0.0000025
      cache_creation_input_token_cost_above_100k_tokens: 0.000000625
      cache_read_input_token_cost_above_100k_tokens: 0.00000005

  ###########################
  # Anthropic Legacy Models #
  ###########################
  # Superseded by the current lineup above (Fable 5.2, Opus 5.5, Sonnet 5.5,
  # Haiku 5.5) but still served — Anthropic lists them as legacy: no further
  # updates, not yet deprecated. Retirement dates:
  # https://platform.claude.com/docs/en/about-claude/model-deprecations

  - model_name: claude-fable-5-1
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-fable-5-1
    model_info:
      <<: *anthropic_model_info
      # Cache reads are 0.025x base input on Fable 5.1 (not the usual 0.1x).
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00005
      cache_creation_input_token_cost: 0.0000125
      cache_read_input_token_cost: 0.00000025

  - model_name: claude-opus-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-opus-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_creation_input_token_cost: 0.00000625
      cache_read_input_token_cost: 0.0000005

  - model_name: claude-opus-4-8
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-opus-4-8
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000025
      cache_creation_input_token_cost: 0.00000625
      cache_read_input_token_cost: 0.0000005

  - model_name: claude-sonnet-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-sonnet-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 0.0000002

  - model_name: claude-sonnet-4-6
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-sonnet-4-6
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0.00000375
      cache_read_input_token_cost: 0.0000003

  - model_name: claude-haiku-4-5
    litellm_params:
      <<: *anthropic_litellm_params
      model: anthropic/claude-haiku-4-5
    model_info:
      <<: *anthropic_model_info
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      cache_creation_input_token_cost: 0.00000125
      cache_read_input_token_cost: 0.0000001
      # Haiku-4.5 is the only Anthropic model with a 200k/64k window. It does
      # support extended thinking (manual `budget_tokens`) and computer use
      # (beta `computer_20250124`), so the anchor's flags apply as-is.
      max_input_tokens: 200000
      max_output_tokens: 65536
      max_tokens: 65536

#########################
# GitHub Copilot Models #
#########################
# Shared device login: no `litellm_credential_name`, so every deployment uses
# the token at $GITHUB_COPILOT_TOKEN_DIR/access-token (personal Copilot Pro).
# Pricing is intentionally NOT set here: LiteLLM's remote cost map carries
# `github_copilot/*` entries that match GitHub's per-token AI-credit rates,
# including long-context tiers. A static copy here would override it and go
# stale. Only add `model_info` pricing for a model missing from that map.
# https://docs.github.com/en/copilot/reference/copilot-billing/models-and-pricing
# Model set mirrors what the Pro plan offers (Gemini 3.8 Flash and Kimi K3 are
# retiring and left out). The `mode: responses` models in the cost map
# (GPT, MAI Code) are served from Copilot's /responses endpoint; LiteLLM
# bridges /v1/chat/completions to it automatically, so either API works.
#
# Claude models share their name with the Anthropic Plan deployments above
# and carry `order: 2`: the Claude subscription (`order: 1`) is always tried
# first, and LiteLLM's order-based fallback re-sends the request here only
# after it errors: 429 usage limit, 529/5xx, 401 expired sk-ant-oat (each
# retried on Anthropic first), and 400s. A request with no sk-ant-oat skips
# Anthropic entirely. Context-window and content-policy errors do not fall
# over. Copilot uses its own token, never the client's sk-ant-oat. Note the
# Copilot Claude window is 200k vs 1M on the subscription.
# Every other model here has no twin, so it is Copilot-only and needs no order.

  - model_name: claude-sonnet-5-5
    litellm_params:
      model: github_copilot/claude-sonnet-5.5
      order: 2

  - model_name: claude-haiku-5-5
    litellm_params:
      model: github_copilot/claude-haiku-5.5
      order: 2

  - model_name: gpt-6.1-terra
    litellm_params:
      model: github_copilot/gpt-6.1-terra

  - model_name: gpt-6-luna
    litellm_params:
      model: github_copilot/gpt-6-luna

  - model_name: gemini-4-hydrogen
    litellm_params:
      model: github_copilot/gemini-4-hydrogen

  - model_name: grok-4.7
    litellm_params:
      model: github_copilot/grok-4.7

  # MAI Code 2 / 2 Flash are on promotional pricing until 2027-05-17.
  - model_name: mai-code-2
    litellm_params:
      model: github_copilot/mai-code-2

  - model_name: mai-code-2-flash
    litellm_params:
      model: github_copilot/mai-code-2-flash

#########################
#      MCP Servers      #
#########################
mcp_servers:

  github_mcp_server:
    alias: github
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/GITHUB_MCP_PAT
    url: https://api.githubcopilot.com/mcp/
    description: "GitHub MCP Server"

  enhanced_channel_manager_mcp_server:
    alias: ecm
    transport: http
    auth_type: bearer_token
    auth_value: os.environ/ECM_MCP_API_KEY
    url: http://enhanced-channel-manager.default.svc:6101/mcp
    description: "Enhanced Channel Manager MCP Server"

  konflate_mcp_server:
    alias: konflate
    transport: http
    auth_type: none
    url: http://konflate.flux-system.svc:8080/mcp
    description: "Konflate MCP Server"

#########################
# Application Settings  #
#########################
general_settings:
  health_check_endpoint: /v1/health
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Name
      litellm_user_role: customer
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: internal_user
  store_model_in_db: true
  supported_db_objects: [guardails, vector_stores, pass_through_endpoints, prompts]
  store_prompts_in_spend_logs: true
  use_redis_transaction_buffer: true # HA
  enable_mcp_registry: true
  require_key_mcp_access_defined: true
  disable_env_credential_login: true

router_settings:
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  # Required for per-user OAuth tokens: one expired `sk-ant-oat01` would
  # otherwise cooldown the deployment and surface 429s for everyone else.
  disable_cooldowns: true
  # Claude Code's auto-mode permission classifier requests
  # `claude-sonnet-5` / `claude-sonnet-5[1m]` (server-side flag, ignores
  # ANTHROPIC_DEFAULT_*_MODEL and CLAUDE_CODE_AUTO_MODE_MODEL). Unmatched,
  # every classifier call fails and auto mode blocks the tool call. Route it to
  # Sonnet 5.5 (same price, cheaper cache reads). The alias takes precedence
  # over the legacy `claude-sonnet-5` deployment, which is unreachable by name.
  model_group_alias:
    claude-sonnet-5: claude-sonnet-5-5
    claude-sonnet-5[1m]: claude-sonnet-5-5
  # One monthly cap across every github_copilot deployment, set to Copilot
  # Pro's included AI credits ($15) so usage never spills into overage. Once
  # crossed, requests fail with 429. LiteLLM's window may not align with
  # GitHub's reset (1st of the month, 00:00 UTC), so this is approximate.
  provider_budget_config:
    github_copilot:
      budget_limit: 15
      time_period: 1mo

litellm_settings:
  success_callback: ["prometheus"]
  prometheus_adapter: true
  require_auth_for_metrics_endpoint: false
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
  drop_params: false
  set_verbose: false

environment_variables: []
